<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="eventBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#042f2e" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#eventBg)"/>
  <circle cx="100" cy="80" r="160" fill="#2dd4bf" fill-opacity="0.15"/>
  <circle cx="700" cy="400" r="200" fill="#5eead4" fill-opacity="0.12"/>
  <g filter="url(#shadow2)" transform="translate(180, 70)">
    <rect width="440" height="340" rx="24" fill="url(#cardGrad2)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
    <!-- Calendar Icon Graphic -->
    <rect x="40" y="40" width="80" height="85" rx="16" fill="#ffffff" fill-opacity="0.95"/>
    <rect x="40" y="40" width="80" height="28" rx="16" fill="#0f766e"/>
    <rect x="55" y="32" width="6" height="14" rx="3" fill="#ffffff"/>
    <rect x="89" y="32" width="6" height="14" rx="3" fill="#ffffff"/>
    <text x="80" y="100" fill="#0f766e" font-family="system-ui, sans-serif" font-size="32" font-weight="900" text-anchor="middle">24</text>
    <rect x="145" y="48" width="140" height="16" rx="8" fill="#5eead4" fill-opacity="0.9"/>
    <rect x="145" y="74" width="220" height="12" rx="6" fill="#ffffff" fill-opacity="0.7"/>
    <rect x="145" y="96" width="160" height="12" rx="6" fill="#ffffff" fill-opacity="0.5"/>
    <rect x="40" y="150" width="360" height="20" rx="6" fill="#ffffff" fill-opacity="0.95"/>
    <rect x="40" y="182" width="290" height="20" rx="6" fill="#ffffff" fill-opacity="0.95"/>
    <!-- Clock / Location details -->
    <g transform="translate(40, 225)">
      <circle cx="12" cy="12" r="10" fill="none" stroke="#ffffff" stroke-width="2"/>
      <polyline points="12,6 12,12 16,14" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <rect x="32" y="6" width="120" height="12" rx="6" fill="#ffffff" fill-opacity="0.7"/>
    </g>
    <g transform="translate(220, 225)">
      <path d="M12,2 C7.5,2 4,5.5 4,10 C4,15 12,22 12,22 C12,22 20,15 20,10 C20,5.5 16.5,2 12,2 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
      <circle cx="12" cy="10" r="3" fill="#ffffff"/>
      <rect x="30" y="6" width="130" height="12" rx="6" fill="#ffffff" fill-opacity="0.7"/>
    </g>
    <rect x="40" y="280" width="140" height="32" rx="16" fill="#ffffff" fill-opacity="0.25"/>
    <text x="110" y="301" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">AGENDA EVENT</text>
  </g>
</svg>
