<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="newsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#newsBg)"/>
  <circle cx="700" cy="100" r="170" fill="#818cf8" fill-opacity="0.15"/>
  <circle cx="120" cy="400" r="150" fill="#a5b4fc" fill-opacity="0.12"/>
  <g filter="url(#shadow3)" transform="translate(180, 70)">
    <rect width="440" height="340" rx="24" fill="url(#cardGrad3)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
    <!-- Newspaper icon -->
    <rect x="40" y="40" width="60" height="60" rx="14" fill="#6366f1"/>
    <g transform="translate(52, 52)">
      <rect width="36" height="26" rx="4" fill="none" stroke="#ffffff" stroke-width="2.5"/>
      <line x1="6" y1="8" x2="16" y2="8" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="6" y1="14" x2="30" y2="14" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <line x1="6" y1="19" x2="24" y2="19" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <rect x="20" y="6" width="10" height="5" rx="1" fill="#ffffff"/>
    </g>
    <rect x="115" y="48" width="120" height="14" rx="7" fill="#818cf8"/>
    <rect x="115" y="72" width="200" height="10" rx="5" fill="#ffffff" fill-opacity="0.6"/>
    <rect x="40" y="130" width="360" height="20" rx="6" fill="#ffffff" fill-opacity="0.95"/>
    <rect x="40" y="160" width="310" height="20" rx="6" fill="#ffffff" fill-opacity="0.95"/>
    <!-- Simulated columns -->
    <rect x="40" y="200" width="170" height="8" rx="4" fill="#ffffff" fill-opacity="0.5"/>
    <rect x="40" y="218" width="170" height="8" rx="4" fill="#ffffff" fill-opacity="0.5"/>
    <rect x="40" y="236" width="140" height="8" rx="4" fill="#ffffff" fill-opacity="0.5"/>
    <rect x="230" y="200" width="170" height="8" rx="4" fill="#ffffff" fill-opacity="0.5"/>
    <rect x="230" y="218" width="170" height="8" rx="4" fill="#ffffff" fill-opacity="0.5"/>
    <rect x="230" y="236" width="130" height="8" rx="4" fill="#ffffff" fill-opacity="0.5"/>
    <rect x="40" y="280" width="130" height="30" rx="15" fill="#ffffff" fill-opacity="0.25"/>
    <text x="105" y="300" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">BERITA SEKOLAH</text>
  </g>
</svg>
