<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="100%" height="100%">
  <defs>
    <linearGradient id="mainHeroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="tealCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="heroShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ambient Glow & Shapes -->
  <circle cx="350" cy="260" r="230" fill="#bfdbfe" fill-opacity="0.4"/>
  <circle cx="520" cy="140" r="120" fill="#93c5fd" fill-opacity="0.3"/>
  <circle cx="160" cy="380" r="100" fill="#a7f3d0" fill-opacity="0.3"/>

  <!-- Main School Building Mock / Platform -->
  <g filter="url(#heroShadow)" transform="translate(100, 100)">
    <!-- Base Platform Card -->
    <rect width="500" height="320" rx="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    
    <!-- Header bar -->
    <rect width="500" height="60" rx="32" fill="#f8fafc"/>
    <rect y="40" width="500" height="20" fill="#f8fafc"/>
    <circle cx="36" cy="30" r="6" fill="#ef4444"/>
    <circle cx="54" cy="30" r="6" fill="#f59e0b"/>
    <circle cx="72" cy="30" r="6" fill="#10b981"/>
    <rect x="110" y="20" width="280" height="20" rx="10" fill="#e2e8f0" fill-opacity="0.8"/>

    <!-- School Dashboard Interior Graphic -->
    <!-- Card 1: Announcement -->
    <g transform="translate(30, 85)">
      <rect width="210" height="95" rx="16" fill="url(#blueCard)"/>
      <circle cx="35" cy="35" r="16" fill="#ffffff" fill-opacity="0.2"/>
      <!-- Megaphone -->
      <path d="M30 32 L36 28 L36 42 L30 38 L26 38 L26 32 Z" fill="#ffffff"/>
      <rect x="62" y="24" width="90" height="10" rx="5" fill="#ffffff"/>
      <rect x="62" y="40" width="130" height="8" rx="4" fill="#bfdbfe"/>
      <rect x="25" y="66" width="160" height="8" rx="4" fill="#ffffff" fill-opacity="0.6"/>
    </g>

    <!-- Card 2: Upcoming Event -->
    <g transform="translate(260, 85)">
      <rect width="210" height="95" rx="16" fill="url(#tealCard)"/>
      <circle cx="35" cy="35" r="16" fill="#ffffff" fill-opacity="0.2"/>
      <rect x="27" y="26" width="16" height="18" rx="3" fill="#ffffff"/>
      <rect x="27" y="26" width="16" height="5" rx="1" fill="#0f766e"/>
      <rect x="62" y="24" width="80" height="10" rx="5" fill="#ffffff"/>
      <rect x="62" y="40" width="130" height="8" rx="4" fill="#99f6e4"/>
      <rect x="25" y="66" width="150" height="8" rx="4" fill="#ffffff" fill-opacity="0.6"/>
    </g>

    <!-- Bottom Content Rows -->
    <g transform="translate(30, 205)">
      <rect width="135" height="85" rx="14" fill="#f1f5f9"/>
      <circle cx="67" cy="36" r="18" fill="#e2e8f0"/>
      <polygon points="67,24 70,32 79,32 72,37 75,45 67,40 60,45 62,37 56,32 64,32" fill="#f59e0b"/>
      <rect x="20" y="62" width="95" height="8" rx="4" fill="#94a3b8"/>
    </g>

    <g transform="translate(182, 205)">
      <rect width="288" height="85" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="18" y="20" width="180" height="12" rx="6" fill="#334155"/>
      <rect x="18" y="40" width="250" height="8" rx="4" fill="#94a3b8"/>
      <rect x="18" y="55" width="200" height="8" rx="4" fill="#cbd5e1"/>
    </g>
  </g>

  <!-- Floating Decorative Badges -->
  <!-- Top Floating Badge -->
  <g filter="url(#heroShadow)" transform="translate(430, 50)">
    <rect width="200" height="60" rx="30" fill="#ffffff" stroke="#f1f5f9" stroke-width="1"/>
    <circle cx="30" cy="30" r="18" fill="#dcfce7"/>
    <path d="M24 30 L28 34 L36 26" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="27" fill="#1e293b" font-family="system-ui, sans-serif" font-size="12" font-weight="700">100% Terverifikasi</text>
    <text x="60" y="42" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Informasi Resmi Sekolah</text>
  </g>

  <!-- Bottom Floating Badge -->
  <g filter="url(#heroShadow)" transform="translate(50, 390)">
    <rect width="210" height="64" rx="32" fill="#ffffff" stroke="#f1f5f9" stroke-width="1"/>
    <circle cx="34" cy="32" r="18" fill="#fee2e2"/>
    <!-- Bell / Announcement icon -->
    <path d="M34 23 C31 23 29 25 29 28 L28 34 L26 36 L42 36 L40 34 L39 28 C39 25 37 23 34 23 Z" fill="#dc2626"/>
    <circle cx="34" cy="39" r="2" fill="#dc2626"/>
    <text x="65" y="28" fill="#1e293b" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Update Real-time</text>
    <text x="65" y="44" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Agenda & Pengumuman</text>
  </g>
</svg>
